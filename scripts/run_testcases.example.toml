# The configuration for scripts/run_testcases.py. Copy this to ~/.renpy/dev/testcases.toml, and edit it to describe
# your computers. Each [target.<name>] table is one way of running the tests, and they all run at the same time.
#
# Keys every target can have:
#
#   type        "source", "local", "wine", or "ssh". (Required.)
#   enabled     false leaves the target out, unless it's named with --target. Default: true.
#   headless    Run on a virtual display with dummy audio, rather than like a normal game. Default: false.
#   timeout     How long the tests may take, in seconds. Default: 900.
#   env         A table of environment variables for the test process.
#   prepare     A shell command run in this repository before anything else starts, such as a build. This only happens
#               when --build is given. Prepare commands run one at a time, and identical commands run once.
#   command     A shell command that replaces the default launch. Ren'Py's arguments are added to the end of it.
#   sync        The top-level items of the repository to copy to the target, replacing the default list.
#
# Without headless, windows open on the target's real display and can take focus from each other or from you. The
# tests also require the window to be the size the game asks for, so a small or scaled display fails them.
#
# A headless target needs xvfb-run, or for a source target, whatever scripts/run-headless.sh finds. Macs don't have
# xvfb-run, so a Mac can't be headless.

[defaults]
# These apply to every target that doesn't set them. Only timeout and headless can be given here.
timeout = 900

# Runs in this repository, using the modules built by run.sh. There can only be one of these.
[target.linux-source]
type = "source"
prepare = "./run.sh --build"

# Runs a private copy of the tree in tmp/run-testcases/stage/linux, using the runtime in lib/.
[target.linux]
type = "local"
prepare = "rpy build --platform linux"
enabled = false

# Runs a private copy of the tree under wine, using the runtime in lib/. A dedicated prefix is recommended, as a
# timeout runs wineserver -k on it.
[target.windows-wine]
type = "wine"
prepare = "rpy build --platform windows"
wineprefix = "~/.wine-renpy-test"

# Rsyncs a copy of the tree to another computer, and runs it over ssh. Logging in must not ask for a password.
#
# The destination must be a directory only used for this: anything inside the synced items that isn't in this
# repository is deleted, except for testcases/screenshots, which holds that target's screenshot baselines.
#
# Over ssh, a non-headless target needs a display on the other computer. A Mac needs you to be logged in. On Linux,
# set DISPLAY or WAYLAND_DISPLAY with env, or use headless.
[target.mac]
type = "ssh"
destination = "tom@mac:/Users/tom/renpy-test"
prepare = "rpy build --platform mac"

[target.linux-arm]
type = "ssh"
destination = "tom@pi:/home/tom/renpy-test"
headless = true
enabled = false
