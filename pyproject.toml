[project]
name = "renpy"
readme = "README.rst"
license = "MIT"
version= "8.99.99"
requires-python = ">=3.12.8,<3.13"
dependencies = [
    "future>=1.0.0",
    "six>=1.17.0",
    "pefile>=2024.8.26",
    "requests>=2.34.2",
    "rsa>=4.9.1",
    "chardet>=7.7.0",
    "websockets>=17.3",
    "pysocks>=1.7.1",
    "certifi>=2026.10.23", # This is to satisfy requests' dependency, but truststore will handle SSL certificates.
    "jinja2>=3.1.6",
    "truststore>=0.10.5",
]

# For now, Ren'Py isn't using a build system, as build isolation makes building too slow.

# [build-system]
# requires = ["setuptools", "cython"]
# build-backend = "setuptools.build_meta:__legacy__"

[tool.pyright]
include = [
    "*.py",
    "renpy/",
    "runtime/",
    "scripts/",
    "src/"
]

extraPaths = [
    "runtime"
]

exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "module/build/",
]

ignore = [
    "renpycoverage.py"
]

typeCheckingMode = "basic"

reportOptionalSubscript = false
reportOptionalMemberAccess = false
reportOptionalCall = false
reportOptionalIterable = false
reportOptionalContextManager = false
reportOptionalOperand = false
reportMissingModuleSource = false
reportUnnecessaryTypeIgnoreComment = "information"
reportTypeCommentUsage = "information"

[tool.cyright]
include = [
    "*.py",
    "renpy/",
    "runtime/",
    "src/"
]

extraPaths = [
    "runtime"
]

exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "module/build/",
]

ignore = [
    "renpycoverage.py"
]

reportGeneralTypeIssues = false
reportOptionalSubscript = false
reportOptionalMemberAccess = false
reportOptionalCall = false
reportOptionalIterable = false
reportOptionalContextManager = false
reportOptionalOperand = false
reportMissingModuleSource = false



[tool.ruff]
line-length = 120
extend-exclude = [
    "keywords.py",
    "renpy/text/emoji_trie.py",
]
ignore = [
    "TRY002",
    "S110",
    "S112",
    "BLE001",
]

[tool.ruff.format]
preview = true

[dependency-groups]
dev = [
    "setuptools>=84.2.1",
    "cython>=3.3.0",
    "pkgconfig>=1.6.0",
    "ruff>=0.17.2",
    "sphinx>=9.1.1",
    "sphinx-rtd-theme>=3.1.0",
    "sphinx-rtd-dark-mode>=1.3.0",
    "sphinx-tabs>=3.5.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
]

[tool.pytest.ini_options]
testpaths = ["pytests"]
